<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>お問い合わせありがとうございます | Phoood</title>
<meta name="description" content="Phooodへのお問い合わせ送信が完了しました。担当者よりご連絡いたします。">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FAF5EE;
    --card:#fff;
    --ink:#241B14;
    --ink-soft:#6E5F52;
    --sizzle:#E64E1B;
    --ember:#C93C12;
    --line:rgba(36,27,20,.12);
    --shadow:0 18px 40px -24px rgba(36,27,20,.45);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:"Noto Sans JP",system-ui,-apple-system,BlinkMacSystemFont,sans-serif;line-height:1.75;}
  a{color:inherit;text-decoration:none}
  .wrap{width:min(920px,100%);margin:0 auto;padding:0 24px}
  header{position:sticky;top:0;z-index:20;background:rgba(250,245,238,.9);border-bottom:1px solid var(--line);backdrop-filter:blur(10px);}
  .nav{height:72px;display:flex;align-items:center;justify-content:space-between;gap:20px}
  .back{display:inline-flex;align-items:center;gap:.45em;color:var(--ink-soft);font-size:.92rem;font-weight:700;transition:color .2s ease;}
  .back:hover{color:var(--sizzle)}
  .brand{display:inline-flex;align-items:baseline;gap:.42em;font-family:"Noto Sans JP",system-ui,sans-serif;letter-spacing:.01em;font-size:1.42rem;font-weight:900}
  .brand span{color:var(--sizzle)}
  .brand small{font-size:.52em;font-weight:800;letter-spacing:.12em;color:var(--ink-soft);text-transform:uppercase}
  main{min-height:calc(100svh - 72px);display:grid;align-items:center;padding:54px 0 72px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:48px 38px;text-align:center;}
  .eyebrow{display:inline-flex;align-items:center;justify-content:center;gap:.55em;color:var(--sizzle);font-size:.78rem;font-weight:900;letter-spacing:.12em;text-transform:uppercase;}
  .eyebrow::before,.eyebrow::after{content:"";display:inline-block;width:24px;height:2px;background:var(--sizzle)}
  h1{margin:.45em 0 .35em;font-size:clamp(1.72rem,3.2vw,2.55rem);line-height:1.3;font-weight:900;letter-spacing:.01em;}
  p{margin:0;color:var(--ink-soft);font-size:1rem;}
  .actions{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:30px;}
  .btn{display:inline-flex;align-items:center;justify-content:center;border-radius:999px;padding:.95em 1.6em;font-weight:900;transition:background .2s ease,transform .2s ease,box-shadow .2s ease;}
  .btn-primary{background:var(--sizzle);color:#fff;box-shadow:0 12px 26px -14px rgba(230,78,27,.75);}
  .btn-primary:hover{background:var(--ember);transform:translateY(-2px)}
  .btn-ghost{border:1.5px solid var(--ink);color:var(--ink);}
  .btn-ghost:hover{background:var(--ink);color:var(--paper);transform:translateY(-2px)}
  @media(max-width:720px){.wrap{padding:0 18px}.nav{height:66px}.brand{font-size:1.12rem}.back{font-size:.84rem}main{min-height:calc(100svh - 66px);padding:38px 0 56px}.card{padding:34px 22px}.actions{display:grid}.btn{width:100%}}
</style>
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-KJGK9K64VH"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-KJGK9K64VH');
  gtag('event', 'generate_lead');
</script>
</head>
<body>
<header>
  <div class="wrap nav">
    <a class="back" href="../index.html">← トップページに戻る</a>
    <a class="brand" href="../index.html"><span>Phoood!!</span><small>Food Photo × AI</small></a>
  </div>
</header>
<main>
  <div class="wrap">
    <section class="card" aria-label="お問い合わせ完了">
      <span class="eyebrow">Thanks</span>
      <h1>お問い合わせ<br>ありがとうございます</h1>
      <p>送信が完了しました。担当者より、ご連絡させていただきます。</p>
      <div class="actions">
        <a class="btn btn-primary" href="../index.html">トップページへ戻る</a>
        <a class="btn btn-ghost" href="../estimation.html">見積りシミュレーションを見る</a>
      </div>
    </section>
  </div>
</main>
</body>
</html>
